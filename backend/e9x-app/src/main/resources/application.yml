# English9x configuration. Every self-set parameter of spec §15.1 is a key here with its default;
# override any of them with an environment variable (relaxed binding, e.g. E9X_GEMINI_MODEL).
spring:
  application:
    name: english9x
  datasource:
    # Runtime login: e9x_app_login (member of e9x_app) owns nothing and is subject to Row-Level Security.
    # The password has no default on purpose: the app refuses to start without E9X_DB_PASSWORD.
    url: ${E9X_DB_URL:jdbc:postgresql://localhost:5432/e9x}
    username: ${E9X_DB_USER:e9x_app_login}
    password: ${E9X_DB_PASSWORD}
  mail:
    # Account mail over SMTP (Mailpit in E2E). Required: the app refuses to start without a host. No password default.
    host: ${E9X_SMTP_HOST:}
    port: ${E9X_SMTP_PORT:587}
    username: ${E9X_SMTP_USER:}
    password: ${E9X_SMTP_PASSWORD:}
    properties:
      # a mail server that stops answering must not hold a worker thread (or a request) for ever
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  flyway:
    # Migrations run as the table owner e9x_owner, never as the runtime login. No default password either.
    user: ${E9X_FLYWAY_USER:e9x_owner}
    password: ${E9X_FLYWAY_PASSWORD}
  modulith:
    events:
      # spec §6: module events are persisted in the publisher's transaction (event_publication, Flyway-owned) and delivered at
      # least once; consumers are idempotent. A completed publication is deleted, so events with ids/addresses do not linger.
      completion-mode: delete
      republish-outstanding-events-on-restart: false   # EventRedelivery (platform.events) is the only redelivery path: a bad row must not stop start-up
      jdbc:
        schema-initialization:
          enabled: false
  servlet:
    multipart:
      # The upload endpoint checks who the caller is before it reads the body (the part is parsed when the controller asks for it).
      # The size limits are not set here: platform.web.MultipartLimits derives them from e9x.content.media.max-upload-size and e9x.content.import.max-media-size.
      resolve-lazily: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${E9X_OPENAPI_ENABLED:false}   # /v3/api-docs; off in production, on in the RLS leak sweep test
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false   # mail is retried and never blocks a request: a mail server that is away does not make the application down

app:
  worker:
    enabled: true   # spec §5.3: false = this instance does not run background jobs (no polling, no worker pool)

e9x:
  # The public https URL of the site. Emailed links and the Google redirect URI are built from it, never from a request.
  public-base-url: ${E9X_PUBLIC_BASE_URL:}
  security:
    # Content-Security-Policy of the SPA and API (same origin only). Tasks that load media from elsewhere extend it here.
    csp: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
  events:
    redelivery-after: 2m             # a module event whose listener has not completed is resubmitted once it is this old (first cycle one period after start-up)
    publication-max-age: 30d         # a publication still incomplete after this is logged as an error and deleted, so a failing row cannot keep personal data for ever
  jobs:
    poll-interval: 2s
    workers: 2                       # general threads, each claims any job type
    priority-types: auto_submit_attempt  # claimed by 1 extra dedicated thread (general threads claim them too), so a burst of ai_grade jobs cannot delay them
    lease: 10m                       # a claim is valid this long without a heartbeat; see JobStore
    heartbeat-interval: 0s           # 0 = lease / 3; renews the lease of a running job
    retention: 7d                    # finished jobs (payload, dedupe key) are deleted this long after they end (purge_finished_jobs); the database never purges under a day
    recurring:
      enabled: true                  # this instance queues the ticks of periodic jobs (several instances may: one tick per time bucket is queued)
      poll: 1m                       # how often it looks at the clock
    max-run: 30m                     # the heartbeat stops after this; override per type with e9x.jobs.<type>.max-run
    default-retry-delays: 30s,2m,10m # a type without its own e9x.jobs.<type>.retry-delays; ai_grade uses e9x.grading.ai.retry-delays
    # The worker's own small pool, as e9x_worker_login (member of e9x_worker, jobs table only). Not the primary
    # DataSource, never reachable from HTTP. The password has no default: a worker instance refuses to start without it.
    worker-datasource:
      url: ${E9X_WORKER_DB_URL:${E9X_DB_URL:jdbc:postgresql://localhost:5432/e9x}}
      username: ${E9X_WORKER_DB_USER:e9x_worker_login}
      password: ${E9X_WORKER_DB_PASSWORD}
      maximum-pool-size: 4

  grading:
    # The grader's own small pool, as e9x_grader_login (member of e9x_grader: reads answer keys, writes scores). Not the primary DataSource, never
    # reachable from HTTP. The password has no default: the application refuses to start without it.
    datasource:
      url: ${E9X_GRADER_DB_URL:${E9X_DB_URL:jdbc:postgresql://localhost:5432/e9x}}
      username: ${E9X_GRADER_DB_USER:e9x_grader_login}
      password: ${E9X_GRADER_DB_PASSWORD}
      maximum-pool-size: 4
    ai:
      per-user-daily-limit: 0        # 0 = unlimited (project-owner decision)
      retry-delays: 30s,2m,10m
      schema-retry: 1
      daily-cost-alert: 500000       # VND per day; alert only, never blocks
    claim-timeout: 24h
    claim-due-warning: 2h            # GRADING_CLAIM_DUE: a teacher is warned when a claimed submission falls due within this time (P4.3)
    claim-job-interval: 5m           # period of the release_expired_claim job (returns overdue claims to the queue, warns about the ones due soon)
    default-mode: AI                 # AI | TEACHER | BOTH: for an exam with no policy row of its own (the administrator's row wins); catalog.api.GradingPolicies
  exam:
    default-max-resumes: 2
    autosave-interval: 5s
    late-sync-grace: 2m
    recording-upload-tolerance: 10s
    max-recording-size: 25MB
    max-answer-size: 64KB
  billing:
    order-expiry: 7d
    transfer-note-max-length: 50
    expiry-reminder: 7d
    job-interval: 1h                 # period of expire_orders, expire_entitlements and plan_expiry_reminder (a tick = one time bucket of this length)
    expired-notice-window: 14d       # expire_entitlements tells the learners whose plan ended this recently; an older end is never announced
  classroom:
    due-soon: 24h                   # ASSIGNMENT_DUE_SOON goes out this long before an assignment's due date (job assignment_due_soon)
    job-interval: 1h                # period of assignment_due_soon
    session-job-interval: 5m        # period of session_reminder (SESSION_REMINDER goes out when a session starts within e9x.notification.session-reminder)
  content:
    import:
      max-rows: 2000
      max-media-size: 500MB
    media:
      max-upload-size: 200MB
    question:
      max-json-size: 256KB
      default-page-size: 50
      max-page-size: 100
      max-group-members: 100
    test:
      default-page-size: 50
      max-page-size: 100
      max-groups-per-part: 100
    strategy:
      max-json-size: 512KB
      max-blocks: 200
      video-hosts: youtube.com,www.youtube.com,m.youtube.com,youtu.be,vimeo.com,www.vimeo.com,player.vimeo.com
  media:
    url-ttl: 10m
    # The private bucket (MinIO). Links are signed for public-url and fetched through the site's own origin (infra/Caddyfile: /<bucket>/*, which keeps the
    # Host the browser sent, the one thing SigV4 signs). A blank endpoint = media off (uploads answer 503). The application's key is limited to this bucket.
    storage:
      endpoint: ${E9X_MINIO_ENDPOINT:}
      public-url: ${E9X_MEDIA_PUBLIC_URL:${e9x.public-base-url:}}
      bucket: ${E9X_MINIO_BUCKET:e9x-media}
      access-key: ${E9X_MINIO_ACCESS_KEY:}
      secret-key: ${E9X_MINIO_SECRET_KEY:}
      region: us-east-1
      ensure-bucket: true            # create the bucket at start-up when it is missing (idempotent)
    ffprobe-path: ${E9X_FFPROBE_PATH:ffprobe}
    probe-timeout: 30s
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    login-rate-limit: 10/15m   # failed attempts per IP + email
    # No default for the signing key: the application refuses to start without E9X_JWT_SECRET (>= 32 bytes).
    jwt-secret: ${E9X_JWT_SECRET:}
    issuer: english9x
    refresh-reuse-grace: 10s    # a refresh token that was rotated < 10 s ago is a benign race (two tabs), not theft
    resend-rate-limit: 3/1h     # verification mails per IP + email
    reset-rate-limit: 5/1h      # password-reset requests per IP + email
    register-rate-limit: ${E9X_AUTH_REGISTER_RATE_LIMIT:20/1h}   # sign-ups per IP
    verification-ttl: 24h
    reset-ttl: 1h
    oauth-code-ttl: 60s         # the one-time code handed to the SPA after Google sign-in
    oauth-consent-ttl: 15m      # how long that code lives once the consent screen is showing
    no-consent-retention: 7d    # a Google account abandoned at the consent step is deleted after this (at least 1 day)
    bcrypt-cost: 10
    password-min-length: 8
    # CIDRs of reverse proxies whose X-Forwarded-For is believed (Caddy). Empty = header ignored.
    trusted-proxies: ${E9X_AUTH_TRUSTED_PROXIES:}
    mail-from: ${E9X_MAIL_FROM:English9x <no-reply@english9x.vn>}
    # Google sign-in is off unless both client-id and client-secret are set.
    google:
      client-id: ${E9X_GOOGLE_CLIENT_ID:}
      client-secret: ${E9X_GOOGLE_CLIENT_SECRET:}
      authorization-uri: ${E9X_GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${E9X_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      jwk-set-uri: ${E9X_GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuer: ${E9X_GOOGLE_ISSUER:https://accounts.google.com}
  org:
    invitation-ttl: 7d             # how long an invitation link stays valid (assumption)
    invitation-hourly-limit: 50    # invitations (mails) one person may send per hour (assumption)
    join:
      ip-rate-limit: 30/15m        # join-code attempts that did not join, per client address (assumption)
      user-rate-limit: 10/15m      # ... per signed-in account (assumption)
  audit:
    default-page-size: 50          # rows per page of the audit-log screen when the request does not say (assumption)
    max-page-size: 100             # the most rows one request may ask for; more is answered with this many (assumption)
    max-detail-bytes: 4096         # the most JSON bytes one audit record's detail may take (assumption)
  workflow:
    max-bundle-size: 2000          # versions one review bundle may hold; keep >= e9x.content.import.max-rows (assumption)
  learning:
    streak:
      min-minutes: 10
    heartbeat-interval: 30s
    idle-timeout: 2m
  notification:
    session-reminder: 1h
    mail-from: ${E9X_MAIL_FROM:English9x <no-reply@english9x.vn>}
    telegram:
      # The bot is off until bot-token is set (no default). webhook-secret is the value Telegram echoes in
      # X-Telegram-Bot-Api-Secret-Token (set it with setWebhook secret_token); the webhook refuses every call without it.
      api-base: ${E9X_TELEGRAM_API_BASE:https://api.telegram.org}
      bot-token: ${E9X_TELEGRAM_BOT_TOKEN:}
      bot-username: ${E9X_TELEGRAM_BOT_USERNAME:}
      webhook-secret: ${E9X_TELEGRAM_WEBHOOK_SECRET:}
      link-ttl: 15m                # how long the one-time /start token of a link stays valid
  backup:
    retention: 14
  gemini:
    base-url: ${E9X_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${E9X_GEMINI_API_KEY:}
    model: gemini-2.5-flash
    timeout: 60s
    # VND per 1k tokens, derived from the Gemini 2.5 Flash list price (USD 0.30 / 2.50 per 1M) at ~25,000 VND/USD
    price-per-1k-input: 7.5
    price-per-1k-output: 62.5
