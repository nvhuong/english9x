# English9x configuration. Every self-set parameter of spec §15.1 is a key here with its default;
# override any of them with an environment variable (relaxed binding, e.g. E9X_GEMINI_MODEL).
spring:
  application:
    name: english9x
  datasource:
    # Runtime login: e9x_app_login (member of e9x_app) owns nothing and is subject to Row-Level Security.
    # The password has no default on purpose: the app refuses to start without E9X_DB_PASSWORD.
    url: ${E9X_DB_URL:jdbc:postgresql://localhost:5432/e9x}
    username: ${E9X_DB_USER:e9x_app_login}
    password: ${E9X_DB_PASSWORD}
  mail:
    # Account mail over SMTP (Mailpit in E2E). Required: the app refuses to start without a host. No password default.
    host: ${E9X_SMTP_HOST:}
    port: ${E9X_SMTP_PORT:587}
    username: ${E9X_SMTP_USER:}
    password: ${E9X_SMTP_PASSWORD:}
  flyway:
    # Migrations run as the table owner e9x_owner, never as the runtime login. No default password either.
    user: ${E9X_FLYWAY_USER:e9x_owner}
    password: ${E9X_FLYWAY_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${E9X_OPENAPI_ENABLED:false}   # /v3/api-docs; off in production, on in the RLS leak sweep test
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  worker:
    enabled: true   # spec §5.3: false = this instance does not run background jobs (no polling, no worker pool)

e9x:
  # The public https URL of the site. Emailed links and the Google redirect URI are built from it, never from a request.
  public-base-url: ${E9X_PUBLIC_BASE_URL:}
  security:
    # Content-Security-Policy of the SPA and API (same origin only). Tasks that load media from elsewhere extend it here.
    csp: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
  jobs:
    poll-interval: 2s
    workers: 2                       # general threads, each claims any job type
    priority-types: auto_submit_attempt  # claimed by 1 extra dedicated thread (general threads claim them too), so a burst of ai_grade jobs cannot delay them
    lease: 10m                       # a claim is valid this long without a heartbeat; see JobStore
    heartbeat-interval: 0s           # 0 = lease / 3; renews the lease of a running job
    max-run: 30m                     # the heartbeat stops after this; override per type with e9x.jobs.<type>.max-run
    default-retry-delays: 30s,2m,10m # a type without its own e9x.jobs.<type>.retry-delays; ai_grade uses e9x.grading.ai.retry-delays
    # The worker's own small pool, as e9x_worker_login (member of e9x_worker, jobs table only). Not the primary
    # DataSource, never reachable from HTTP. The password has no default: a worker instance refuses to start without it.
    worker-datasource:
      url: ${E9X_WORKER_DB_URL:${E9X_DB_URL:jdbc:postgresql://localhost:5432/e9x}}
      username: ${E9X_WORKER_DB_USER:e9x_worker_login}
      password: ${E9X_WORKER_DB_PASSWORD}
      maximum-pool-size: 4

  grading:
    ai:
      per-user-daily-limit: 0        # 0 = unlimited (project-owner decision)
      retry-delays: 30s,2m,10m
      schema-retry: 1
      daily-cost-alert: 500000       # VND per day; alert only, never blocks
    claim-timeout: 24h
  exam:
    default-max-resumes: 2
    autosave-interval: 5s
    late-sync-grace: 2m
  billing:
    order-expiry: 7d
    transfer-note-max-length: 50
    expiry-reminder: 7d
  content:
    import:
      max-rows: 2000
      max-media-size: 500MB
    media:
      max-upload-size: 200MB
  media:
    url-ttl: 10m
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    login-rate-limit: 10/15m   # failed attempts per IP + email
    # No default for the signing key: the application refuses to start without E9X_JWT_SECRET (>= 32 bytes).
    jwt-secret: ${E9X_JWT_SECRET:}
    issuer: english9x
    refresh-reuse-grace: 10s    # a refresh token that was rotated < 10 s ago is a benign race (two tabs), not theft
    resend-rate-limit: 3/1h     # verification mails per IP + email
    reset-rate-limit: 5/1h      # password-reset requests per IP + email
    register-rate-limit: ${E9X_AUTH_REGISTER_RATE_LIMIT:20/1h}   # sign-ups per IP
    verification-ttl: 24h
    reset-ttl: 1h
    oauth-code-ttl: 60s         # the one-time code handed to the SPA after Google sign-in
    oauth-consent-ttl: 15m      # how long that code lives once the consent screen is showing
    bcrypt-cost: 10
    password-min-length: 8
    # CIDRs of reverse proxies whose X-Forwarded-For is believed (Caddy). Empty = header ignored.
    trusted-proxies: ${E9X_AUTH_TRUSTED_PROXIES:}
    mail-from: ${E9X_MAIL_FROM:English9x <no-reply@english9x.vn>}
    # Google sign-in is off unless both client-id and client-secret are set.
    google:
      client-id: ${E9X_GOOGLE_CLIENT_ID:}
      client-secret: ${E9X_GOOGLE_CLIENT_SECRET:}
      authorization-uri: ${E9X_GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${E9X_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      jwk-set-uri: ${E9X_GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuer: ${E9X_GOOGLE_ISSUER:https://accounts.google.com}
  learning:
    streak:
      min-minutes: 10
    heartbeat-interval: 30s
    idle-timeout: 2m
  notification:
    session-reminder: 1h
  backup:
    retention: 14
  gemini:
    base-url: ${E9X_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${E9X_GEMINI_API_KEY:}
    model: gemini-2.5-flash
    timeout: 60s
    # VND per 1k tokens, derived from the Gemini 2.5 Flash list price (USD 0.30 / 2.50 per 1M) at ~25,000 VND/USD
    price-per-1k-input: 7.5
    price-per-1k-output: 62.5
