# English9x stack.  First:  cp infra/.env.example infra/.env, fill in E9X_JWT_SECRET (README, Run the stack). Then:
#   docker compose --env-file infra/.env -f infra/docker-compose.yml up --build -d
# Credentials come from env vars (see README); the password defaults below are for localhost only: service preflight refuses them on any other E9X_DOMAIN.
# Database logins (P1.3): POSTGRES_USER is the bootstrap superuser (backup only); Flyway connects as the
# table owner e9x_owner; the running app connects as e9x_app_login, which owns nothing and is subject to RLS; the
# background-job worker (P1.7) has its own small pool as e9x_worker_login (jobs table only, also subject to RLS).
# The roles are created by infra/postgres/init/01-roles.sh on first start.
name: english9x

services:
  # Runs once and exits; postgres and minio wait for it, so nothing starts on a public domain with a published password (infra/preflight.sh).
  preflight:
    image: postgres:16.15@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    entrypoint: ["/bin/sh", "/preflight.sh"]
    environment:
      E9X_DOMAIN: ${E9X_DOMAIN:-localhost}
      E9X_SMTP_HOST: ${E9X_SMTP_HOST:?E9X_SMTP_HOST is required. Run - cp infra/.env.example infra/.env - and start with --env-file infra/.env, see README}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-e9x_dev_password}
      E9X_FLYWAY_PASSWORD: ${E9X_FLYWAY_PASSWORD:-e9x_owner_dev_password}
      E9X_DB_PASSWORD: ${E9X_DB_PASSWORD:-e9x_app_dev_password}
      E9X_WORKER_DB_PASSWORD: ${E9X_WORKER_DB_PASSWORD:-e9x_worker_dev_password}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-e9x_minio_dev_password}
      E9X_MINIO_SECRET_KEY: ${E9X_MINIO_SECRET_KEY:-e9x_media_dev_secret}
    volumes:
      - ./preflight.sh:/preflight.sh:ro
    restart: "no"

  postgres:
    image: postgres:16.15@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-e9x}
      POSTGRES_USER: ${POSTGRES_USER:-e9x}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-e9x_dev_password}
      E9X_OWNER_PASSWORD: ${E9X_FLYWAY_PASSWORD:-e9x_owner_dev_password}
      E9X_APP_PASSWORD: ${E9X_DB_PASSWORD:-e9x_app_dev_password}
      E9X_WORKER_PASSWORD: ${E9X_WORKER_DB_PASSWORD:-e9x_worker_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # MinIO no longer publishes pullable images on Docker Hub / Quay; the Chainguard build is the maintained free one.
    # Its free tier only offers the floating `latest` tag, so we pin the digest instead.
    # Refresh: docker buildx imagetools inspect chainguard/minio:latest  (copy the Digest), test, then update below.
    image: chainguard/minio@sha256:aea6c163749e1caca37f907976dcf337177ddf5f558808f2aa591618fd3a6eef
    depends_on:
      preflight:
        condition: service_completed_successfully
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-e9x_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-e9x_minio_dev_password}
    volumes:
      - miniodata:/data
    healthcheck:
      # no curl/wget in the image: speak HTTP through bash's /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *200* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Runs once and exits (idempotent): creates the private media bucket and the application's own key, limited to that bucket (infra/minio/init.sh).
  # The app starts only after it, so the app never holds the MinIO root credentials. Nothing publishes MinIO's ports: Caddy is the only way in.
  minio-init:
    image: chainguard/minio-client@sha256:10388d580a724f356b94c9b2631b5a179039cabe8c76e9b37d86ed007d569b05
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["bash", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-e9x_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-e9x_minio_dev_password}
      E9X_MINIO_BUCKET: ${E9X_MINIO_BUCKET:-e9x-media}
      E9X_MINIO_ACCESS_KEY: ${E9X_MINIO_ACCESS_KEY:-e9x_media_app}
      E9X_MINIO_SECRET_KEY: ${E9X_MINIO_SECRET_KEY:-e9x_media_dev_secret}
    volumes:
      - ./minio/init.sh:/init.sh:ro
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: infra/app.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      E9X_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-e9x}
      E9X_DB_USER: e9x_app_login
      E9X_DB_PASSWORD: ${E9X_DB_PASSWORD:-e9x_app_dev_password}
      E9X_FLYWAY_USER: e9x_owner
      E9X_FLYWAY_PASSWORD: ${E9X_FLYWAY_PASSWORD:-e9x_owner_dev_password}
      # app.worker.enabled (default true): this instance also runs background jobs, over its own pool as this login
      E9X_WORKER_DB_USER: e9x_worker_login
      E9X_WORKER_DB_PASSWORD: ${E9X_WORKER_DB_PASSWORD:-e9x_worker_dev_password}
      E9X_GEMINI_API_KEY: ${E9X_GEMINI_API_KEY:-}
      # Media (P2.2). The app talks to MinIO inside the Compose network with a key limited to the one bucket (not the root credentials), and signs links for
      # the public address, which Caddy serves under /<bucket>/ (infra/Caddyfile). The links are signed for E9X_PUBLIC_BASE_URL (https://$E9X_DOMAIN).
      E9X_MINIO_ENDPOINT: http://minio:9000
      E9X_MINIO_BUCKET: ${E9X_MINIO_BUCKET:-e9x-media}
      E9X_MINIO_ACCESS_KEY: ${E9X_MINIO_ACCESS_KEY:-e9x_media_app}
      E9X_MINIO_SECRET_KEY: ${E9X_MINIO_SECRET_KEY:-e9x_media_dev_secret}
      # Identity (P1.4). The JWT secret and the SMTP host have NO default: Compose stops right here with the message below when they are missing.
      # Generate the secret with `openssl rand -hex 32`. Dev/E2E: scripts/e2e.sh does it for you.
      E9X_DOMAIN: ${E9X_DOMAIN:-localhost}
      E9X_PUBLIC_BASE_URL: https://${E9X_DOMAIN:-localhost}
      E9X_JWT_SECRET: ${E9X_JWT_SECRET:?E9X_JWT_SECRET is required. Run - cp infra/.env.example infra/.env - put in the output of - openssl rand -hex 32 - and start with --env-file infra/.env, see README}
      E9X_SMTP_HOST: ${E9X_SMTP_HOST:?E9X_SMTP_HOST is required. Run - cp infra/.env.example infra/.env - and start with --env-file infra/.env, see README}
      E9X_SMTP_PORT: ${E9X_SMTP_PORT:-587}
      E9X_SMTP_USER: ${E9X_SMTP_USER:-}
      E9X_SMTP_PASSWORD: ${E9X_SMTP_PASSWORD:-}
      E9X_MAIL_FROM: ${E9X_MAIL_FROM:-English9x <no-reply@english9x.vn>}
      # Telegram (P1.8): the bot is off until the token and the bot's username are set; the webhook refuses everything without the secret
      E9X_TELEGRAM_BOT_TOKEN: ${E9X_TELEGRAM_BOT_TOKEN:-}
      E9X_TELEGRAM_BOT_USERNAME: ${E9X_TELEGRAM_BOT_USERNAME:-}
      E9X_TELEGRAM_WEBHOOK_SECRET: ${E9X_TELEGRAM_WEBHOOK_SECRET:-}
      # Real SMTP usually needs: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true and SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      # Caddy is the only thing that reaches the app (port 8080 is not published), so its Docker-network address is the
      # trusted proxy whose X-Forwarded-For is believed for the login rate limit.
      E9X_AUTH_TRUSTED_PROXIES: ${E9X_AUTH_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # Google sign-in is off unless both are set (Google Cloud console: OAuth client, redirect URI
      # https://<domain>/api/auth/oauth2/callback/google)
      E9X_GOOGLE_CLIENT_ID: ${E9X_GOOGLE_CLIENT_ID:-}
      E9X_GOOGLE_CLIENT_SECRET: ${E9X_GOOGLE_CLIENT_SECRET:-}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # On SIGTERM the job worker stops claiming and waits up to 30s for running handlers, and Spring's graceful shutdown drains requests. Docker's default
    # 10s would kill it first and burn an attempt of every running job on each deploy.
    stop_grace_period: 40s
    restart: unless-stopped

  caddy:
    image: caddy:2.11@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    ports:
      - "80:80"
      - "443:443"
    environment:
      E9X_DOMAIN: ${E9X_DOMAIN:-localhost}
      E9X_MINIO_BUCKET: ${E9X_MINIO_BUCKET:-e9x-media}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # through Caddy to the app's "/", on a listener only this container can reach (infra/Caddyfile): a Caddy that cannot proxy is unhealthy
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  backup:
    build:
      context: backup
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-e9x}
      PGUSER: ${POSTGRES_USER:-e9x}
      PGPASSWORD: ${POSTGRES_PASSWORD:-e9x_dev_password}
      E9X_OWNER_PASSWORD: ${E9X_FLYWAY_PASSWORD:-e9x_owner_dev_password}   # restore.sh only; this container already holds the superuser's
      E9X_BACKUP_RETENTION: ${E9X_BACKUP_RETENTION:-14}
      # the media bucket is mirrored through the S3 API (mc mirror), with the root credentials: this container already holds the database superuser's
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${E9X_MINIO_BUCKET:-e9x-media}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-e9x_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-e9x_minio_dev_password}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # healthy once a dump from the past 26h exists (startup run + every 24h)
      test: ["CMD-SHELL", "find /backups -name 'pg-*.sql.gz' -mmin -1560 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
  backups:
