# E2E / dev overlay:  docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml up --build
# Adds Mailpit (captures email) and the fake Telegram / Gemini servers, points the app at them and activates the
# Spring profile `e2e` (the test-data API POST /api/test/seed/*, which does not exist without it).
# Normally driven by scripts/e2e.sh (project name e9x-e2e, clean database, always torn down with `down -v`).
# Host ports are overridable: E9X_MAILPIT_PORT (8025), E9X_FAKE_TELEGRAM_PORT (8081), E9X_FAKE_GEMINI_PORT (8082).
services:
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "${E9X_MAILPIT_PORT:-8025}:8025"   # web UI / API (the app reaches SMTP on the Compose network, mailpit:1025)
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-telegram:
    image: node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    working_dir: /fake
    command: ["node", "server.mjs"]
    volumes:
      - ./fakes/telegram:/fake:ro
    ports:
      - "${E9X_FAKE_TELEGRAM_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__health"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-gemini:
    image: node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    working_dir: /fake
    command: ["node", "server.mjs"]
    volumes:
      - ./fakes/gemini:/fake:ro
    ports:
      - "${E9X_FAKE_GEMINI_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__health"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    depends_on:
      mailpit:
        condition: service_healthy
      fake-telegram:
        condition: service_healthy
      fake-gemini:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      E9X_GEMINI_BASE_URL: http://fake-gemini:8080
      E9X_GEMINI_API_KEY: fake-key
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      E9X_TELEGRAM_API_BASE: http://fake-telegram:8080
